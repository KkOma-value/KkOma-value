<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 345" width="580" height="345" role="img" aria-labelledby="t d">
<title id="t">Terminal session: joseph, agent harness engineer at HelloBike, building Mirage</title>
<desc id="d">An engineered terminal demonstrating agent harness operations: whoami, mirage status, harness list, and execution trace of scheduling and context compaction.</desc>

<defs>
  <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#1c2128"/>
    <stop offset="100%" stop-color="#161b22"/>
  </linearGradient>
</defs>

<!-- Window Frame -->
<rect x="0.5" y="0.5" width="579" height="344" rx="10" fill="#0d1117" stroke="#30363d"/>

<!-- Window Titlebar -->
<path d="M0.5 10.5 C0.5 5 5 0.5 10.5 0.5 H569.5 C575 0.5 579.5 5 579.5 10.5 V36.5 H0.5 Z" fill="url(#headerGrad)"/>
<path d="M0.5 36.5 H579.5" stroke="#30363d"/>

<!-- Window Controls -->
<circle cx="20" cy="18.5" r="5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
<circle cx="36" cy="18.5" r="5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
<circle cx="52" cy="18.5" r="5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

<!-- Window Title -->
<text x="74" y="22.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#7d8590" letter-spacing="0.3">mirage : agent session [zsh]</text>

<!-- Telemetry Status Pills (Right Header) -->
<g transform="translate(340, 11)">
  <rect x="0" y="0" width="228" height="16" rx="8" fill="#1f242c" stroke="#30363d" stroke-width="0.8"/>
  <circle cx="10" cy="8" r="3.5" fill="#2ea043">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="18" y="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#3fb950" font-weight="600" letter-spacing="0.4">LIVE</text>
  <text x="48" y="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#7d8590">|</text>
  <text x="56" y="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#8b949e">runtime: mirage-v1</text>
  <text x="156" y="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#7d8590">|</text>
  <text x="164" y="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#e0a458">sandbox: strict</text>
</g>

<!-- Terminal Body Text -->
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" lengthAdjust="spacing">
  <!-- Line 1: whoami -->
  <text x="22" y="62" fill="#e6edf3" textLength="72">$ whoami</text>
  <text x="22" y="84" fill="#8b949e" textLength="387">joseph · agent harness engineer @ HelloBike</text>

  <!-- Line 2: mirage status -->
  <text x="22" y="112" fill="#e6edf3" textLength="135">$ mirage status</text>
  <text x="22" y="134" fill="#8b949e" textLength="306">building HelloBike's agent harness</text>
  <text x="338" y="134" fill="#e0a458" font-weight="600" textLength="68">[running]</text>

  <!-- Line 3: harness list -->
  <text x="22" y="162" fill="#e6edf3" textLength="135">$ harness list</text>
  <text x="22" y="184" fill="#8b949e" textLength="280">claude-code   codex   antigravity   </text>
  <text x="312" y="184" fill="#e0a458" font-weight="600" textLength="16">pi</text>

  <!-- Trace Panel Divider Line -->
  <line x1="22" y1="202" x2="558" y2="202" stroke="#21262d" stroke-dasharray="3 3"/>

  <!-- Line 4: mirage schedule trace -->
  <text x="22" y="226" fill="#e6edf3" textLength="207">$ mirage schedule --trace</text>
  <text x="22" y="248" fill="#7d8590" textLength="108">[scheduler]</text>
  <text x="134" y="248" fill="#8b949e" textLength="288">compacting context window ··· </text>
  <text x="426" y="248" fill="#e0a458" font-weight="600" textLength="132">4.2x (32k -> 7.6k)</text>

  <text x="22" y="270" fill="#7d8590" textLength="108">[permission]</text>
  <text x="134" y="270" fill="#8b949e" textLength="306">sandbox policy verified (safe-io)</text>
  <text x="444" y="270" fill="#3fb950" font-weight="600" textLength="50">✔ PASS</text>

  <text x="22" y="292" fill="#7d8590" textLength="72">[verify]</text>
  <text x="98" y="292" fill="#3fb950" textLength="380">✔ 4 agent runtimes synchronized · 0 failures</text>

  <!-- Line 5: active prompt -->
  <text x="22" y="320" fill="#e6edf3" textLength="18">$</text>
</g>

<!-- Typewriter reveal covers:
     Base width is 0 so static previews display complete text.
     SMIL animates width from full to 0 and x across each line. -->
<g fill="#0d1117">
  <!-- Cover Line 1 prompt -->
  <rect x="94" y="49" width="0" height="18">
    <animate attributeName="width" values="72;72;0;0" keyTimes="0;0.02;0.06;1" dur="5.5s" fill="freeze"/>
    <animate attributeName="x" values="22;22;94;94" keyTimes="0;0.02;0.06;1" dur="5.5s" fill="freeze"/>
  </rect>
  <!-- Cover Line 1 output -->
  <rect x="409" y="71" width="0" height="18">
    <animate attributeName="width" values="387;387;0;0" keyTimes="0;0.06;0.14;1" dur="5.5s" fill="freeze"/>
    <animate attributeName="x" values="22;22;409;409" keyTimes="0;0.06;0.14;1" dur="5.5s" fill="freeze"/>
  </rect>

  <!-- Cover Line 2 prompt -->
  <rect x="157" y="99" width="0" height="18">
    <animate attributeName="width" values="135;135;0;0" keyTimes="0;0.16;0.22;1" dur="5.5s" fill="freeze"/>
    <animate attributeName="x" values="22;22;157;157" keyTimes="0;0.16;0.22;1" dur="5.5s" fill="freeze"/>
  </rect>
  <!-- Cover Line 2 output -->
  <rect x="406" y="121" width="0" height="18">
    <animate attributeName="width" values="384;384;0;0" keyTimes="0;0.22;0.31;1" dur="5.5s" fill="freeze"/>
    <animate attributeName="x" values="22;22;406;406" keyTimes="0;0.22;0.31;1" dur="5.5s" fill="freeze"/>
  </rect>

  <!-- Cover Line 3 prompt -->
  <rect x="157" y="149" width="0" height="18">
    <animate attributeName="width" values="135;135;0;0" keyTimes="0;0.33;0.39;1" dur="5.5s" fill="freeze"/>
    <animate attributeName="x" values="22;22;157;157" keyTimes="0;0.33;0.39;1" dur="5.5s" fill="freeze"/>
  </rect>
  <!-- Cover Line 3 output -->
  <rect x="328" y="171" width="0" height="18">
    <animate attributeName="width" values="306;306;0;0" keyTimes="0;0.39;0.48;1" dur="5.5s" fill="freeze"/>
    <animate attributeName="x" values="22;22;328;328" keyTimes="0;0.39;0.48;1" dur="5.5s" fill="freeze"/>
  </rect>

  <!-- Cover Line 4 prompt -->
  <rect x="229" y="213" width="0" height="18">
    <animate attributeName="width" values="207;207;0;0" keyTimes="0;0.50;0.58;1" dur="5.5s" fill="freeze"/>
    <animate attributeName="x" values="22;22;229;229" keyTimes="0;0.50;0.58;1" dur="5.5s" fill="freeze"/>
  </rect>
  <!-- Cover Line 4 Trace 1 -->
  <rect x="558" y="235" width="0" height="18">
    <animate attributeName="width" values="536;536;0;0" keyTimes="0;0.58;0.68;1" dur="5.5s" fill="freeze"/>
    <animate attributeName="x" values="22;22;558;558" keyTimes="0;0.58;0.68;1" dur="5.5s" fill="freeze"/>
  </rect>
  <!-- Cover Line 4 Trace 2 -->
  <rect x="494" y="257" width="0" height="18">
    <animate attributeName="width" values="472;472;0;0" keyTimes="0;0.68;0.77;1" dur="5.5s" fill="freeze"/>
    <animate attributeName="x" values="22;22;494;494" keyTimes="0;0.68;0.77;1" dur="5.5s" fill="freeze"/>
  </rect>
  <!-- Cover Line 4 Trace 3 -->
  <rect x="478" y="279" width="0" height="18">
    <animate attributeName="width" values="456;456;0;0" keyTimes="0;0.77;0.86;1" dur="5.5s" fill="freeze"/>
    <animate attributeName="x" values="22;22;478;478" keyTimes="0;0.77;0.86;1" dur="5.5s" fill="freeze"/>
  </rect>

  <!-- Cover Line 5 prompt -->
  <rect x="40" y="307" width="0" height="18">
    <animate attributeName="width" values="18;18;0;0" keyTimes="0;0.87;0.90;1" dur="5.5s" fill="freeze"/>
    <animate attributeName="x" values="22;22;40;40" keyTimes="0;0.87;0.90;1" dur="5.5s" fill="freeze"/>
  </rect>
</g>

<!-- Blinking Cursor Caret -->
<rect x="44" y="309" width="7.5" height="14" fill="#e0a458">
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.87;0.90" dur="5.5s" fill="freeze"/>
  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" calcMode="discrete" dur="1s" begin="5.0s" repeatCount="indefinite"/>
</rect>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 262" width="440" height="262" role="img" aria-labelledby="t d">
<title id="t">Terminal session: joseph, agent harness engineer at HelloBike, building Mirage</title>
<desc id="d">A terminal types four commands. whoami returns joseph, agent harness engineer at HelloBike. mirage status returns building HelloBike's agent harness. harness --list returns claude-code, codex, antigravity, pi.</desc>

<rect x="0.5" y="0.5" width="439" height="261" rx="8" fill="#0d1117" stroke="#2d333b"/>
<path d="M0.5 36.5 H439.5" stroke="#2d333b"/>

<circle cx="20" cy="18" r="3.5" fill="#e0a458">
  <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" begin="0.2s" repeatCount="3" fill="freeze"/>
</circle>
<text x="34" y="22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#636e7b" textLength="72" lengthAdjust="spacing">mirage — zsh</text>

<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" lengthAdjust="spacing">
  <text x="20" y="62"  fill="#e6edf3" textLength="72">$ whoami</text>
  <text x="20" y="88"  fill="#8b949e" textLength="387">joseph · agent harness engineer @ HelloBike</text>
  <text x="20" y="120" fill="#e6edf3" textLength="135">$ mirage status</text>
  <text x="20" y="146" fill="#8b949e" textLength="306">building HelloBike's agent harness</text>
  <text x="20" y="178" fill="#e6edf3" textLength="144">$ harness --list</text>
  <text x="20"  y="204" fill="#8b949e" textLength="297">claude-code  codex  antigravity  </text>
  <text x="317" y="204" fill="#e0a458" textLength="18" font-weight="600">pi</text>
  <text x="20" y="236" fill="#e6edf3" textLength="18">$</text>
</g>

<!-- Typewriter reveal: one background-coloured cover per line, wiped left to
     right. Base width is 0, so if animation is ever blocked the static file is
     the finished frame, not a blank card. clipPath is deliberately avoided:
     Chrome does not re-evaluate a clip whose child geometry is SMIL-animated.
     Reveals hold at width 0 first (never begin at exactly t=0). -->
<g fill="#0d1117">
  <rect x="92"  y="47"  width="0" height="20"><animate attributeName="width" values="72;72;0;0"    keyTimes="0;0.03;0.10;1" dur="4.4s" fill="freeze"/><animate attributeName="x" values="20;20;92;92"    keyTimes="0;0.03;0.10;1" dur="4.4s" fill="freeze"/></rect>
  <rect x="407" y="73"  width="0" height="20"><animate attributeName="width" values="387;387;0;0"  keyTimes="0;0.12;0.24;1" dur="4.4s" fill="freeze"/><animate attributeName="x" values="20;20;407;407"  keyTimes="0;0.12;0.24;1" dur="4.4s" fill="freeze"/></rect>
  <rect x="155" y="105" width="0" height="20"><animate attributeName="width" values="135;135;0;0"  keyTimes="0;0.27;0.35;1" dur="4.4s" fill="freeze"/><animate attributeName="x" values="20;20;155;155"  keyTimes="0;0.27;0.35;1" dur="4.4s" fill="freeze"/></rect>
  <rect x="326" y="131" width="0" height="20"><animate attributeName="width" values="306;306;0;0"  keyTimes="0;0.37;0.50;1" dur="4.4s" fill="freeze"/><animate attributeName="x" values="20;20;326;326"  keyTimes="0;0.37;0.50;1" dur="4.4s" fill="freeze"/></rect>
  <rect x="164" y="163" width="0" height="20"><animate attributeName="width" values="144;144;0;0"  keyTimes="0;0.53;0.62;1" dur="4.4s" fill="freeze"/><animate attributeName="x" values="20;20;164;164"  keyTimes="0;0.53;0.62;1" dur="4.4s" fill="freeze"/></rect>
  <rect x="335" y="189" width="0" height="20"><animate attributeName="width" values="315;315;0;0"  keyTimes="0;0.64;0.80;1" dur="4.4s" fill="freeze"/><animate attributeName="x" values="20;20;335;335"  keyTimes="0;0.64;0.80;1" dur="4.4s" fill="freeze"/></rect>
  <rect x="38"  y="221" width="0" height="20"><animate attributeName="width" values="18;18;0;0"    keyTimes="0;0.83;0.86;1" dur="4.4s" fill="freeze"/><animate attributeName="x" values="20;20;38;38"    keyTimes="0;0.83;0.86;1" dur="4.4s" fill="freeze"/></rect>
</g>

<!-- caret: hidden until the prompt lands, then blinks forever like a real shell -->
<rect x="44" y="224" width="8" height="15" fill="#e0a458">
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.83;0.86" dur="4.4s" fill="freeze"/>
  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" calcMode="discrete" dur="1.06s" begin="3.9s" repeatCount="indefinite"/>
</rect>
</svg>

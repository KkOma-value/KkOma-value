<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 345" width="580" height="345" role="img" aria-labelledby="t d">
<title id="t">Terminal session: joseph, agent harness engineer at HelloBike, building Mirage</title>
<desc id="d">An engineered terminal demonstrating agent harness operations: whoami, mirage status, harness list, and execution trace of scheduling and context compaction.</desc>

<defs>
  <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#1c2128"/>
    <stop offset="100%" stop-color="#161b22"/>
  </linearGradient>
</defs>

<!-- Window Frame -->
<rect x="0.5" y="0.5" width="579" height="344" rx="10" fill="#0d1117" stroke="#30363d"/>

<!-- Window Titlebar -->
<path d="M0.5 10.5 C0.5 5 5 0.5 10.5 0.5 H569.5 C575 0.5 579.5 5 579.5 10.5 V36.5 H0.5 Z" fill="url(#headerGrad)"/>
<path d="M0.5 36.5 H579.5" stroke="#30363d"/>

<!-- Window Controls -->
<circle cx="20" cy="18.5" r="5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
<circle cx="36" cy="18.5" r="5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
<circle cx="52" cy="18.5" r="5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

<!-- Window Title -->
<text x="74" y="22.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#7d8590" letter-spacing="0.3">mirage : agent session [zsh]</text>

<!-- Telemetry Status Pills (Right Header) -->
<g transform="translate(340, 11)">
  <rect x="0" y="0" width="228" height="16" rx="8" fill="#1f242c" stroke="#30363d" stroke-width="0.8"/>
  <circle cx="10" cy="8" r="3.5" fill="#2ea043">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="18" y="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#3fb950" font-weight="600" letter-spacing="0.4">LIVE</text>
  <text x="48" y="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#7d8590">|</text>
  <text x="56" y="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#8b949e">runtime: mirage-v1</text>
  <text x="156" y="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#7d8590">|</text>
  <text x="164" y="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#e0a458">sandbox: strict</text>
</g>

<!-- Terminal Body Text -->
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
  <!-- Line 1: whoami -->
  <text x="22" y="62" fill="#e6edf3">$ whoami</text>
  <text x="22" y="84" fill="#8b949e">joseph · agent harness engineer @ HelloBike</text>

  <!-- Line 2: mirage status -->
  <text x="22" y="112" fill="#e6edf3">$ mirage status</text>
  <text x="22" y="134" fill="#8b949e">building HelloBike's agent harness <tspan fill="#e0a458" font-weight="600">[running]</tspan></text>

  <!-- Line 3: harness list -->
  <text x="22" y="162" fill="#e6edf3">$ harness list</text>
  <text x="22" y="184" fill="#8b949e">claude-code   codex   antigravity   <tspan fill="#e0a458" font-weight="600">Pi</tspan></text>

  <!-- Trace Panel Divider Line -->
  <line x1="22" y1="202" x2="558" y2="202" stroke="#21262d" stroke-dasharray="3 3"/>

  <!-- Line 4: mirage schedule trace -->
  <text x="22" y="226" fill="#e6edf3">$ mirage schedule --trace</text>
  <text x="22" y="248"><tspan fill="#7d8590">[scheduler]</tspan> <tspan fill="#8b949e">compacting context window ··· </tspan><tspan fill="#e0a458" font-weight="600">4.2x (32k -&gt; 7.6k)</tspan></text>
  <text x="22" y="270"><tspan fill="#7d8590">[permission]</tspan> <tspan fill="#8b949e">sandbox policy verified (safe-io) </tspan><tspan fill="#3fb950" font-weight="600">✔ PASS</tspan></text>
  <text x="22" y="292"><tspan fill="#7d8590">[verify]</tspan> <tspan fill="#3fb950">✔ 4 agent runtimes synchronized · 0 failures</tspan></text>

  <!-- Line 5: active prompt -->
  <text x="22" y="320" fill="#e6edf3">$</text>
</g>

<!-- Typewriter reveal covers:
     Base width is 0 so static previews display complete text.
     SMIL animates width from full to 0 and x across each line. -->
<g fill="#0d1117">
  <!-- Cover Line 1 prompt -->
  <rect x="112" y="49" width="0" height="18">
    <animate attributeName="width" values="90;90;0;0" keyTimes="0;0.02;0.06;1" dur="5.5s" fill="freeze"/>
    <animate attributeName="x" values="22;22;112;112" keyTimes="0;0.02;0.06;1" dur="5.5s" fill="freeze"/>
  </rect>
  <!-- Cover Line 1 output -->
  <rect x="442" y="71" width="0" height="18">
    <animate attributeName="width" values="420;420;0;0" keyTimes="0;0.06;0.14;1" dur="5.5s" fill="freeze"/>
    <animate attributeName="x" values="22;22;442;442" keyTimes="0;0.06;0.14;1" dur="5.5s" fill="freeze"/>
  </rect>

  <!-- Cover Line 2 prompt -->
  <rect x="172" y="99" width="0" height="18">
    <animate attributeName="width" values="150;150;0;0" keyTimes="0;0.16;0.22;1" dur="5.5s" fill="freeze"/>
    <animate attributeName="x" values="22;22;172;172" keyTimes="0;0.16;0.22;1" dur="5.5s" fill="freeze"/>
  </rect>
  <!-- Cover Line 2 output -->
  <rect x="462" y="121" width="0" height="18">
    <animate attributeName="width" values="440;440;0;0" keyTimes="0;0.22;0.31;1" dur="5.5s" fill="freeze"/>
    <animate attributeName="x" values="22;22;462;462" keyTimes="0;0.22;0.31;1" dur="5.5s" fill="freeze"/>
  </rect>

  <!-- Cover Line 3 prompt -->
  <rect x="172" y="149" width="0" height="18">
    <animate attributeName="width" values="150;150;0;0" keyTimes="0;0.33;0.39;1" dur="5.5s" fill="freeze"/>
    <animate attributeName="x" values="22;22;172;172" keyTimes="0;0.33;0.39;1" dur="5.5s" fill="freeze"/>
  </rect>
  <!-- Cover Line 3 output -->
  <rect x="402" y="171" width="0" height="18">
    <animate attributeName="width" values="380;380;0;0" keyTimes="0;0.39;0.48;1" dur="5.5s" fill="freeze"/>
    <animate attributeName="x" values="22;22;402;402" keyTimes="0;0.39;0.48;1" dur="5.5s" fill="freeze"/>
  </rect>

  <!-- Cover Line 4 prompt -->
  <rect x="272" y="213" width="0" height="18">
    <animate attributeName="width" values="250;250;0;0" keyTimes="0;0.50;0.58;1" dur="5.5s" fill="freeze"/>
    <animate attributeName="x" values="22;22;272;272" keyTimes="0;0.50;0.58;1" dur="5.5s" fill="freeze"/>
  </rect>
  <!-- Cover Line 4 Trace 1 -->
  <rect x="562" y="235" width="0" height="18">
    <animate attributeName="width" values="540;540;0;0" keyTimes="0;0.58;0.68;1" dur="5.5s" fill="freeze"/>
    <animate attributeName="x" values="22;22;562;562" keyTimes="0;0.58;0.68;1" dur="5.5s" fill="freeze"/>
  </rect>
  <!-- Cover Line 4 Trace 2 -->
  <rect x="562" y="257" width="0" height="18">
    <animate attributeName="width" values="540;540;0;0" keyTimes="0;0.68;0.77;1" dur="5.5s" fill="freeze"/>
    <animate attributeName="x" values="22;22;562;562" keyTimes="0;0.68;0.77;1" dur="5.5s" fill="freeze"/>
  </rect>
  <!-- Cover Line 4 Trace 3 -->
  <rect x="562" y="279" width="0" height="18">
    <animate attributeName="width" values="540;540;0;0" keyTimes="0;0.77;0.86;1" dur="5.5s" fill="freeze"/>
    <animate attributeName="x" values="22;22;562;562" keyTimes="0;0.77;0.86;1" dur="5.5s" fill="freeze"/>
  </rect>

  <!-- Cover Line 5 prompt -->
  <rect x="52" y="307" width="0" height="18">
    <animate attributeName="width" values="30;30;0;0" keyTimes="0;0.87;0.90;1" dur="5.5s" fill="freeze"/>
    <animate attributeName="x" values="22;22;52;52" keyTimes="0;0.87;0.90;1" dur="5.5s" fill="freeze"/>
  </rect>
</g>

<!-- Blinking Cursor Caret -->
<rect x="36" y="309" width="7.5" height="14" fill="#e0a458">
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.87;0.90" dur="5.5s" fill="freeze"/>
  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" calcMode="discrete" dur="1s" begin="5.0s" repeatCount="indefinite"/>
</rect>

</svg>
